name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: gravity-ui/release-action@v1
      with:
        github-token: ${{ secrets.GRAVITY_UI_BOT_GITHUB_TOKEN }}
        npm-token: ${{ secrets.GRAVITY_UI_BOT_NPM_TOKEN }}
        node-version: 22
        # `latest` is released from release/v11 while GridStack matures here. Not `v10`: npm rejects
        # tags that read as semver ranges, https://docs.npmjs.com/cli/commands/npm-dist-tag#caveats
        npm-dist-tag: latest-10
